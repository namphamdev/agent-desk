[package]
name = "comet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-proto.workspace = true
comet-doc.workspace = true
comet-engine.workspace = true
comet-rpc.workspace = true
comet-update.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
merman.workspace = true
# Pin merman-render's transitive roughr fork. merman-render 0.7.0 was released
# against roughr-merman 0.12.0, but 0.12.2 changed svgtypes 0.11 -> 0.16
# without a semver bump (and dropped OptionsBuilder::seed), which breaks the
# merman-render 0.7.0 build. Constrain it back to the compatible 0.12.0.
roughr-merman = "=0.12.0"
alacritty_terminal.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
global-hotkey.workspace = true
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
